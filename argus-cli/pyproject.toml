[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-cli"
version = "0.1.0"
description = "Argus DevOps Health Map — CLI detector"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
argus = "argus_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["argus_cli*"]
