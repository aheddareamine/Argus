<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Argus — DevOps Health Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ── Top bar ──────────────────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo">◈</span>
      <span class="topbar__name">Argus</span>
      <span class="topbar__sub">DevOps Health Map</span>
    </div>

    <div class="topbar__status">
      <span id="scenario-badge" class="badge badge--healthy">● HEALTHY</span>
      <span id="last-updated" class="topbar__updated"></span>
    </div>

    <div class="topbar__controls">
      <button id="btn-healthy"  class="btn btn--healthy btn--active">⬤ Healthy</button>
      <button id="btn-incident" class="btn btn--incident">⬤ Incident</button>
      <button id="btn-sync"     class="btn btn--sync" title="Pull from real GitHub connector">⟳ Sync</button>
    </div>
  </header>

  <!-- ── Main layout ──────────────────────────────────────────────────────── -->
  <main class="layout">

    <!-- Graph panel -->
    <section class="panel panel--graph">
      <div class="panel__header">
        <span class="panel__title">Pipeline Health</span>
        <span id="incident-count-badge" class="badge badge--neutral" style="display:none"></span>
      </div>
      <div id="cy" class="graph-canvas"></div>
      <div class="graph-legend">
        <span class="legend-item"><span class="dot dot--healthy"></span>Healthy</span>
        <span class="legend-item"><span class="dot dot--degraded"></span>Degraded</span>
        <span class="legend-item"><span class="dot dot--failing"></span>Failing</span>
        <span class="legend-item"><span class="dot dot--unknown"></span>Unknown</span>
      </div>
    </section>

    <!-- Incident / detail panel -->
    <aside class="panel panel--detail" id="detail-panel">

      <!-- Empty state -->
      <div id="detail-empty" class="detail-empty">
        <div class="detail-empty__icon">◈</div>
        <p class="detail-empty__title">No active incidents</p>
        <p class="detail-empty__sub">Click a node to inspect a service,<br>or trigger an incident scenario.</p>
      </div>

      <!-- Incident detail -->
      <div id="detail-content" class="detail-content" style="display:none">
        <div class="detail-service">
          <span id="detail-service-name" class="detail-service__name"></span>
          <span id="detail-service-status" class="detail-service__status"></span>
        </div>
        <div class="detail-block">
          <div class="detail-block__label">POSSIBLE CAUSE</div>
          <p id="detail-cause" class="detail-block__body"></p>
        </div>
        <div class="detail-block">
          <div class="detail-block__label">EVIDENCE</div>
          <ul id="detail-evidence" class="evidence-list"></ul>
        </div>
        <div class="detail-block">
          <div class="detail-block__label">EVENT TIMELINE</div>
          <div id="detail-timeline" class="timeline"></div>
        </div>
        <div id="detail-ai-block" class="detail-block" style="display:none">
          <div class="detail-block__label">AI ANALYSIS</div>
          <p id="detail-ai" class="detail-block__body detail-block__body--ai"></p>
        </div>
      </div>

      <!-- Service info (no incident) -->
      <div id="detail-service-info" class="detail-content" style="display:none">
        <div class="detail-service">
          <span id="detail-node-name" class="detail-service__name"></span>
          <span id="detail-node-status" class="detail-service__status"></span>
        </div>
        <p class="detail-block__body" style="margin-top:1.5rem;color:var(--text-muted)">
          No active incidents for this service.
        </p>
      </div>

    </aside>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
